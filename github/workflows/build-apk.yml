name: Build Android APK (AR Smart Service)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Add Android Platform
        run: |
          npm install
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Copy App Icons to Android
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp www/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp www/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AR-Smart-Service-v34-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
