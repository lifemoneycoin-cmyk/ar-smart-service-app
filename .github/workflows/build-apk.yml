name: Build Android APK (AR Smart Service)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor & Add Android Platform
        run: |
          npm install
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Inject Android Permissions (Notifications, Camera, Location, Contacts)
        run: |
          python3 - << 'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          txt = open(p).read()
          perms = [
            "android.permission.POST_NOTIFICATIONS",
            "android.permission.CAMERA",
            "android.permission.ACCESS_FINE_LOCATION",
            "android.permission.ACCESS_COARSE_LOCATION",
            "android.permission.READ_CONTACTS",
            "android.permission.READ_MEDIA_IMAGES"
          ]
          ins = ""
          for pm in perms:
            if pm not in txt:
              ins += f'    <uses-permission android:name="{pm}" />\n'
          if ins:
            txt = txt.replace("<application", ins + "    <application", 1)
          open(p, "w").write(txt)
          PY

      - name: Set Real AR Smart Service App Icon (Remove Default Cross)
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp www/icon-512.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp www/icon-512.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AR-Smart-Service-v46-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
