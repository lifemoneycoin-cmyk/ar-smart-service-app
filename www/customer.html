<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3a7a">
<title>AR Smart</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--pri:#1a4fa0;--pri2:#0f3a7a;--bg:#eef2f8;--tx:#18222f;--mu:#667487;--bd:#d6deea;--ok:#16a34a;--bad:#c62828;--warn:#d97706}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{flex:none;background:linear-gradient(135deg,#1a4fa0,#0b2f6b);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;border-radius:0 0 22px 22px;box-shadow:0 10px 24px -14px rgba(11,47,107,.9)}
header .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:19px;font-weight:800}header p{margin:2px 0 0;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
header img{width:40px;height:40px;border-radius:12px;background:#fff;padding:3px}
.search{margin-top:12px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:0 12px;color:var(--mu)}
.search input{border:0;outline:0;width:100%;height:44px;font:inherit;color:var(--tx);background:none}
#prev{display:none;flex:none;background:#fff7d6;color:#7a5a00;padding:8px 14px;font-size:13px;font-weight:600;justify-content:space-between;align-items:center;gap:10px}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 100px;-webkit-overflow-scrolling:touch}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -8px 24px -18px rgba(11,47,107,.6)}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;color:var(--mu);font-size:11px;font-weight:600;position:relative}
nav button i{font-style:normal;font-size:22px}nav button.on{color:var(--pri)}
nav button.on i{background:#e4edfb;border-radius:14px;padding:0 14px}
nav .dot{position:absolute;top:2px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;min-width:16px;text-align:center}
h2{font-size:17px;margin:18px 2px 10px}h2:first-child{margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:#fff;border:0;border-radius:18px;padding:14px 6px 10px;text-align:center;box-shadow:0 6px 16px -12px rgba(11,47,107,.7);text-decoration:none;color:inherit;display:block}
.cat i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 6px;border-radius:16px;background:#eaf1fd;font-style:normal;font-size:28px}
.cat b{display:block;font-size:12.5px}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 16px -14px rgba(11,47,107,.7)}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card small{color:var(--mu)}.card .sm2{display:block;margin-top:2px}
.tag{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.g{background:#dcf5e5;color:#126b34}.o{background:#fff0d6;color:#9a5b00}.r{background:#fde4e4;color:#a11}.b{background:#e4edfb;color:var(--pri2)}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--pri);color:#fff;font-weight:700;padding:13px;text-align:center;text-decoration:none;margin-top:10px}
.btn.sec{background:#e4edfb;color:var(--pri2)}.btn.ok{background:var(--ok)}.btn.bad{background:#fde4e4;color:var(--bad)}
.ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #e1e8f2}.ln:last-child{border:0}
.hero{background:linear-gradient(135deg,#1a4fa0,#0b2f6b);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px}
.hero b{font-size:26px;display:block}.hero small{opacity:.85}
.empty{text-align:center;color:var(--mu);padding:30px 10px}.empty i{display:block;font-size:44px;font-style:normal}
.steps{display:flex;justify-content:space-between;margin:12px 0 4px;position:relative}
.steps span{flex:1;text-align:center;font-size:11px;color:var(--mu);position:relative}
.steps span:before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:#d6deea;margin:0 auto 4px}
.steps span.on{color:var(--pri2);font-weight:700}.steps span.on:before{background:var(--ok)}
details summary{cursor:pointer;color:var(--pri);font-weight:600;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th,td{padding:5px 4px;border-bottom:1px solid #eef1f6;text-align:left}th:last-child,td:last-child{text-align:right}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}.trust div{background:#fff;border-radius:14px;padding:10px 6px;text-align:center;font-size:11.5px;font-weight:600}.trust i{display:block;font-style:normal;font-size:20px}
.lbl{color:var(--mu);font-size:12px;font-weight:600}
</style>
<link rel="stylesheet" href="theme.css?v=44.1">
<script src="app-bridge.js?v=43.0"></script>
</head>
<body>
<div id="prev"><span id="prevT"></span><a href="index.html#/customers" style="color:#7a5a00">Exit ✕</a></div>
<header>
 <div class="row"><div><h1 id="hi">Hi 👋</h1><p id="addr">AR Smart Service</p></div><img src="logo.png" alt=""></div>
 <div class="search" id="sbox"><span>🔎</span><input id="q" placeholder="Search a service, e.g. AC, RO, Fridge"></div>
</header>
<main id="m"><div class="empty"><i>⏳</i>Loading…</div></main>
<nav id="nav"></nav>
<script src="fb.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var money=function(n){return '₹'+(Math.round((+n||0)*100)/100).toLocaleString('en-IN')};
var fd=function(d){return d?String(d).split('-').reverse().join('/'):''};
var P=new URLSearchParams(location.search);
var APPS=[['AC','❄️','AC service'],['Refrigerator','🍦','Fridge / freezer'],['RO Plant','💧','RO plant'],['Water Cooler','🚰','Water cooler'],['Water Chiller','🧊','Water chiller'],['Washing Machine','🧺','Washing machine'],['Other','🔧','Other repair']];
var ST={new:['📩','Received','b'],confirmed:['✅','Confirmed','b'],done:['🎉','Completed','g'],cancelled:['❌','Cancelled','r']};
var TST={assigned:'Technician assigned',accepted:'Technician accepted',enroute:'On the way',started:'Work started',approval:'Waiting for your approval',done:'Work completed'};
var TAB='home',DATA={bk:{},docs:{}},ME={name:'',email:'',mobile:'',addr:''},PH='',PREVIEW=false,CFG=null;

function tab(t){TAB=t;draw()}
function bookings(){return Object.values(DATA.bk).sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))||((b.createdAt||0)-(a.createdAt||0))})}
function docs(t){return Object.values(DATA.docs).filter(function(d){return d.status!='draft'&&(Array.isArray(t)?t.indexOf(d.type)>=0:d.type==t)}).sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))||((b.ts||0)-(a.ts||0))})}
function due(){return docs('bill').reduce(function(t,d){return t+Math.max(0,(+d.amount||0)-(+d.paid||0))},0)}

function vHome(q){
 q=(q||'').toLowerCase();var L=APPS.filter(function(a){return !q||a[2].toLowerCase().indexOf(q)>=0});
 var act=bookings().filter(function(b){return b.src!='job'&&b.status!='done'&&b.status!='cancelled'&&b.techStatus!='done'})[0],dd=due();
 var h='';
 if(!q){
  if(act)h+='<div class="card" data-t="bookings" style="cursor:pointer"><div class="top"><div><span class="lbl">YOUR UPCOMING SERVICE</span><b style="display:block;font-size:16px;margin-top:2px">'+esc(svcNames(act))+'</b><small class="sm2">'+fd(act.date)+(act.slot?' · '+esc(act.slot):'')+'</small></div><span class="tag b">'+esc(stText(act))+'</span></div></div>';
  if(dd>0)h+='<div class="hero" data-t="bills" style="cursor:pointer"><small>Payment due</small><b>'+money(dd)+'</b><small>Tap to see bills ›</small></div>';
 }
 h+='<h2>'+(q?'Results':'What do you need?')+'</h2>';
 h+=L.length?'<div class="grid">'+L.map(function(a){return '<a class="cat" href="booking.html#app='+encodeURIComponent(a[0])+'"><i>'+a[1]+'</i><b>'+a[2]+'</b></a>'}).join('')+'</div>':'<div class="empty"><i>🔍</i>No service found. Call us and we will help.</div>';
 if(!q)h+='<h2>Why AR Smart</h2><div class="trust"><div><i>🛡️</i>Trusted technicians</div><div><i>🧾</i>Proper bill &amp; report</div><div><i>📍</i>Service at your door</div></div>'+(PH?'<a class="btn sec" href="tel:'+esc(PH)+'">📞 Call us '+esc(PH)+'</a>':'');
 return h
}
function svcNames(b){var s=Array.isArray(b.svc)?b.svc.map(function(x){return x.n}).join(', '):'';return s||b.name||'Service visit'}
function stText(b){if(b.src=='job')return TST[b.techStatus]||'Scheduled';if(b.techStatus=='done')return 'Completed';return (ST[b.status]||ST.new)[1]}
function steps(b){
 var s=b.techStatus=='done'||b.status=='done'?3:(b.techStatus=='started'||b.techStatus=='enroute'||b.techStatus=='accepted')?2:b.status=='confirmed'?1:0;
 return '<div class="steps">'+['Booked','Confirmed','On the job','Done'].map(function(x,i){return '<span class="'+(i<=s?'on':'')+'">'+x+'</span>'}).join('')+'</div>'
}
function vBookings(){
 var L=bookings();if(!L.length)return '<div class="empty"><i>📅</i>No bookings yet.<a class="btn" href="booking.html">Book a service</a></div>';
 return L.map(function(b){var t=b.src=='job'?['🛠️',stText(b),'b']:(b.techStatus=='done'?ST.done:(ST[b.status]||ST.new));
  return '<div class="card"><div class="top"><div><b>'+esc(svcNames(b))+'</b><small class="sm2">'+fd(b.date)+(b.slot?' · '+esc(b.slot):'')+'</small></div><span class="tag '+t[2]+'">'+t[0]+' '+esc(t[1])+'</span></div>'+(b.status=='cancelled'?'':steps(b))+
  (b.techName?'<div class="ln"><span>Technician</span><b>'+esc(b.techName)+'</b></div>':'')+(b.techPhone?'<a class="btn sec" href="tel:'+esc(b.techPhone)+'">📞 Call technician</a>':'')+
  (b.src!='job'&&b._id?'<a class="btn sec" href="booking.html#s='+esc(b._id)+'">Track / pay on status page ›</a>':'')+'</div>'}).join('')
}
function bTag(d){var a=+d.amount||0,p=+d.paid||0;return a>0&&p>=a?'<span class="tag g">Paid</span>':p>0?'<span class="tag o">Partial</span>':'<span class="tag r">Unpaid</span>'}
function vBills(){
 var L=docs(['bill','quote']),dd=due();if(!L.length)return '<div class="empty"><i>🧾</i>No bills yet. Your bills will appear here after the work.</div>';
 var h=dd>0?'<div class="hero"><small>Total due</small><b>'+money(dd)+'</b>'+(CFG&&CFG.upi?'<small>Pay by UPI: <b style="display:inline;font-size:14px">'+esc(CFG.upi)+'</b></small>':'')+'</div>':'';
 return h+L.map(function(d){var x=d.data||{},its=(x.items||[]).filter(function(i){return i.d}),pays=x.pays||[],bal=Math.max(0,(+d.amount||0)-(+d.paid||0));
  return '<div class="card"><div class="top"><div><b>'+(d.type=='quote'?'📝 Quotation':'🧾 Bill')+' · '+esc(d.no||'')+'</b><small class="sm2">'+fd(d.date)+'</small></div>'+(d.type=='bill'?bTag(d):'<span class="tag b">Quote</span>')+'</div>'+
  '<div class="ln"><span>Total</span><b>'+money(d.amount)+'</b></div>'+(d.type=='bill'?'<div class="ln"><span>Paid</span><b style="color:#126b34">'+money(d.paid)+'</b></div><div class="ln"><span>Balance</span><b style="color:'+(bal>0?'#a11':'#126b34')+'">'+money(bal)+'</b></div>':'')+
  '<details><summary>View details</summary>'+(its.length?'<table><tr><th>Item</th><th>Qty</th><th>Amount</th></tr>'+its.map(function(i){return '<tr><td>'+esc(i.d)+'</td><td>'+esc(i.q)+'</td><td>'+money((+i.q||0)*(+i.r||0))+'</td></tr>'}).join('')+'</table>':'')+
  (pays.length?'<div class="lbl" style="margin-top:10px">PAYMENTS</div>'+pays.map(function(p){return '<div class="ln"><span>'+fd(p.d)+' · '+esc(p.m||'')+'</span><b>'+money(p.a)+'</b></div>'}).join(''):'')+'</details></div>'}).join('')
}
function vReports(){
 var L=docs(['completion','report']);if(!L.length)return '<div class="empty"><i>📋</i>Job reports will appear here after your service is completed.</div>';
 return L.map(function(d){var x=d.data||{};
  if(d.type=='completion')return '<div class="card"><div class="top"><div><b>✅ Job complete · '+esc(d.no||'')+'</b><small class="sm2">'+fd(d.date)+(x.area?' · '+esc(x.area):'')+(x.room?' · Room '+esc(x.room):'')+'</small></div><span class="tag g">Done</span></div>'+
   [['Problem',x.problem],['Part used',x.parts],['Work done',x.work],['Result',x.result]].filter(function(r){return r[1]}).map(function(r){return '<div class="ln"><span>'+r[0]+'</span><b style="text-align:right">'+esc(r[1])+'</b></div>'}).join('')+'</div>';
  return '<div class="card"><div class="top"><div><b>❄️ Service report · '+esc(d.no||'')+'</b><small class="sm2">'+fd(d.date)+(x.area?' · '+esc(x.area):'')+'</small></div><span class="tag b">Report</span></div>'+(x.brand?'<div class="ln"><span>Brand</span><b>'+esc(x.brand)+'</b></div>':'')+(x.work?'<div class="ln"><span>Work</span><b>'+esc(x.work)+'</b></div>':'')+'</div>'}).join('')
}
function vAccount(){
 return '<div class="card"><div class="ln"><span>Name</span><b>'+esc(ME.name||'—')+'</b></div><div class="ln"><span>Email</span><b>'+esc(ME.email||'—')+'</b></div><div class="ln"><span>Mobile</span><b>'+esc(ME.mobile||'—')+'</b></div><div class="ln"><span>Address</span><b style="text-align:right">'+esc(ME.addr||'—')+'</b></div></div>'+
 '<a class="btn" href="booking.html">➕ Book a service</a>'+(PH?'<a class="btn sec" href="tel:'+esc(PH)+'">📞 Call '+esc(PH)+'</a>':'')+
 (PREVIEW?'':'<button class="btn sec" id="pw">🔑 Change password (link on email)</button><button class="btn bad" id="lo">Logout</button>')
}
var TABS=[['home','🏠','Home'],['bookings','📅','Bookings'],['bills','🧾','Bills'],['reports','📋','Reports'],['account','👤','Account']];
function draw(){
 var q=($('#q')||{}).value||'',m=$('#m');
 $('#sbox').style.display=TAB=='home'?'flex':'none';
 m.innerHTML=TAB=='home'?vHome(q):TAB=='bookings'?vBookings():TAB=='bills'?vBills():TAB=='reports'?vReports():vAccount();
 var dd=due();
 $('#nav').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(TAB==t[0]?'on':'')+'"><i>'+t[1]+'</i>'+t[2]+(t[0]=='bills'&&dd>0?'<span class="dot">!</span>':'')+'</button>'}).join('');
 var lo=$('#lo');if(lo)lo.onclick=function(){FB.logout().then(function(){location.replace('login.html')})};
 var pw=$('#pw');if(pw)pw.onclick=function(){FB.reset(ME.email).then(function(){alert('Password reset link sent to '+ME.email)}).catch(function(){alert('Could not send. Try again.')})};
}
document.addEventListener('click',function(e){var t=e.target.closest('[data-t]');if(t){tab(t.dataset.t);var m=$('#m');if(m)m.scrollTop=0}});
$('#q').addEventListener('input',function(){if(TAB=='home'){$('#m').innerHTML=vHome($('#q').value)}});

function start(email,u){
 ME.email=email;
 var hi=function(){$('#hi').textContent='Hi'+(ME.name?', '+ME.name.split(' ')[0]:'')+' 👋';$('#addr').textContent=ME.addr||'AR Smart Service'};
 if(!PREVIEW)FB.getProfile(u.uid).then(function(p){if(p){ME.name=p.name||ME.name;ME.mobile=p.mobile||ME.mobile;ME.addr=p.addr||ME.addr}hi();draw()}).catch(function(){});
 FB.getConfig().then(function(c){CFG=c;if(c&&c.phone)PH=String(c.phone).replace(/\D/g,'').slice(-10);draw()}).catch(function(){});
 var err=function(){};
 var addB=function(l,k){l.forEach(function(x){if(k=='job'&&x.src!='job')return;DATA.bk[x._id]=x;if(!ME.name&&x.name){ME.name=x.name;ME.mobile=ME.mobile||x.mobile;ME.addr=ME.addr||x.addr}});hi();draw()};
 try{FB.byQuery('docs','custEmail',email,function(l){l.forEach(function(x){DATA.docs[x._id]=x;var c=x.cust||{};if(!ME.name&&c.name){ME.name=c.name;ME.mobile=ME.mobile||c.mobile;ME.addr=ME.addr||c.addr||c.site}});hi();draw()},err)}catch(e){}
 try{FB.byQuery('bookings','email',email,function(l){addB(l,'b')},err)}catch(e){}
 try{FB.byQuery('bookings','custEmail',email,function(l){addB(l,'job')},err)}catch(e){}
 if(!PREVIEW)try{FB.byField('uid',u.uid,function(l){addB(l,'b')},err)}catch(e){}
 hi();draw()
}
FB.onAuth(async function(u){
 if(!u){location.replace('login.html');return}
 var as=(P.get('as')||'').trim().toLowerCase(),role=null;
 try{role=await FB.role(u)}catch(e){}
 if(role=='admin'&&as){PREVIEW=true;$('#prev').style.display='flex';$('#prevT').textContent='👁 Admin preview – customer: '+as;start(as,u);return}
 if(role=='admin'){location.replace('index.html');return}
 if(role=='tech'){location.replace('tech.html');return}
 start(String(u.email||'').toLowerCase(),u)
});
draw();
})();
</script>
</body>
</html>
