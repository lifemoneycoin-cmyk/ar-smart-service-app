<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f3a7a">
<link rel="icon" href="icon-192.png">
<title>AR Smart Service – Technician</title>
<style>
:root{--pri:#1a4fa0;--pri2:#0f3a7a;--bg:#eef2f8;--tx:#18222f;--mu:#667487;--bd:#d6deea;--ok:#1d9e4a;--bad:#d93025}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Inter","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.w{max-width:560px;margin:0 auto}
.top{background:linear-gradient(135deg,#1a4fa0,#0f3a7a);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 20px;border-radius:0 0 22px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{margin:0;font-size:19px}.top p{margin:2px 0 0;font-size:12.5px;opacity:.88}
.top button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px}
.card{background:#fff;border-radius:18px;padding:14px;margin:12px 14px 0;box-shadow:0 1px 3px rgba(20,40,80,.08)}
.card h2{margin:0 0 8px;font-size:15px;color:var(--pri2)}
label.f{display:block;margin:0 0 10px}label.f>span{display:block;font-size:12.5px;color:var(--mu);margin:0 0 3px}
input{font:inherit;color:inherit;width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;outline:0}
.btn{display:block;width:100%;min-height:48px;border:0;border-radius:14px;background:var(--pri);color:#fff;font:inherit;font-weight:700;text-align:center;text-decoration:none;padding:12px;cursor:pointer}
.btn.sec{background:#e3ebf8;color:var(--pri2)}.btn.ok{background:var(--ok)}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.bd{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:#ffefd1;color:#8a5600}
.bd.g{background:#dcf5e6;color:#126b34}.bd.b{background:#e3efff;color:#1a4fa0}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}td,th{padding:5px 4px;border-bottom:1px solid #eef1f6;text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600;font-size:12px}
.net{background:#e8f7ee;border-radius:12px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;font-weight:700;color:#126b34;font-size:17px}
.mu{color:var(--mu);font-size:13.5px}.err{color:var(--bad);font-size:14px;margin:6px 0}
details summary{font-weight:700;color:var(--pri2);cursor:pointer}details p{white-space:pre-wrap;font-size:14px;margin:8px 0 0}
.empty{text-align:center;color:var(--mu);padding:30px 14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;border:1.5px solid var(--bd);background:#fff;border-radius:14px;font:inherit;font-weight:600;color:var(--tx);cursor:pointer}.or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12.5px;margin:14px 0}.or::before,.or::after{content:'';flex:1;height:1px;background:var(--bd)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 14px 0}.st{background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(20,40,80,.08)}.st b{display:block;font-size:22px;color:var(--pri2)}.st span{font-size:12px;color:var(--mu)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 14px 0}.tile{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;text-decoration:none;color:var(--tx);box-shadow:0 1px 3px rgba(20,40,80,.08);font-size:12.5px;font-weight:600}.tile i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}.tile small{display:block;font-size:10.5px;color:#8a5600;font-weight:600}

.tabs{display:flex;gap:6px;margin:12px 14px 0;background:#fff;padding:5px;border-radius:16px;box-shadow:0 1px 3px rgba(20,40,80,.08)}
.tab{flex:1;border:0;background:transparent;border-radius:12px;padding:9px 4px;font:inherit;font-size:13px;font-weight:600;color:var(--mu);cursor:pointer}
.tab.on{background:var(--pri);color:#fff}
.sec{font-size:13px;font-weight:700;color:var(--pri2);margin:18px 16px 0;text-transform:uppercase;letter-spacing:.04em}
.jc{background:#fff;border-radius:18px;padding:14px;margin:10px 14px 0;box-shadow:0 1px 3px rgba(20,40,80,.08);cursor:pointer;border-left:4px solid var(--pri)}
.jh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.jn{font-weight:700;font-size:16px}
.jm{color:var(--mu);font-size:13.5px;margin:6px 0 4px;line-height:1.5}
.jf{color:var(--pri);font-weight:700;font-size:13px;text-align:right}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill.n{background:#ffefd1;color:#8a5600}.pill.b{background:#e3efff;color:#1a4fa0}.pill.g{background:#dcf5e6;color:#126b34}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #eef1f6;font-size:14px}
.kv span{color:var(--mu)}
.net.neg{background:#fde3e1;color:#a5201a}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:10px;align-items:center}
.step i{width:28px;height:28px;border-radius:50%;background:#eef1f6;color:var(--mu);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:13px;flex:none}
.step.ok i{background:var(--ok);color:#fff}.step.cur i{background:var(--pri);color:#fff}
.step b{font-size:14px;display:block}.step small{color:var(--mu);font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select{font:inherit;color:inherit;width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;background:#fff}
textarea{font:inherit;color:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;resize:vertical}
.wcalc{background:#f5f8fd;border-radius:12px;padding:10px 12px;margin:4px 0 10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.thumbs img{width:96px;height:96px;object-fit:contain;background:#f4f6fa;border-radius:12px;border:1px solid var(--bd);cursor:pointer}
#photoV{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom;overflow:auto}
#photoV img{max-width:100%;max-height:100%;object-fit:contain}
#photoV .x{position:fixed;top:14px;right:14px;border:0;border-radius:50%;width:40px;height:40px;background:#fff;font-size:20px}
.times{display:flex;gap:6px;margin-top:8px}.times span{flex:1;background:#f5f8fd;border-radius:10px;padding:6px;font-size:12px;color:var(--mu);text-align:center}.times b{display:block;color:var(--tx);font-size:13px}
.prof{display:flex;gap:14px;align-items:center}
.pav{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#1a4fa0,#0f3a7a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex:none}
.pn{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vb{background:#e3f6ea;color:#126b34;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px}
.sig{max-width:260px;height:auto;background:#fff;border:1px dashed var(--bd);border-radius:12px;padding:6px}
.card-e{background:#fff;border-radius:18px;margin:14px 14px 0;padding:20px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:120}
.top button{min-width:40px}
/* no-copy UI: text stays selectable only in fields */
body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text}

/* ---- 37: bill overlay, colourful wallet ---- */
.ov{position:fixed;inset:0;z-index:300;background:#eef3fa;display:flex;flex-direction:column}
.ov-top{background:linear-gradient(135deg,#0f3a7a,#1f6fe0);color:#fff;padding:14px;display:flex;align-items:center;gap:12px;font-weight:800;font-size:17px}
.ov-top .ov-x{background:rgba(255,255,255,.2);border:0;color:#fff;width:42px;height:42px;border-radius:14px;font-size:18px}
.ov iframe{flex:1;width:100%;border:0;background:#fff}
.ov-bot{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;background:#fff;border-top:1px solid #e3eaf5}
.bb{height:52px;border-radius:16px;border:0;font-weight:800;font-size:15px;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;background:linear-gradient(135deg,#1a4fa0,#2563eb);font-family:inherit}
.bb.g{background:linear-gradient(135deg,#16a34a,#15803d)}
.ov .sb{flex:1;overflow:auto;padding:16px}
.wsum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wt{border-radius:18px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:0 10px 18px -12px rgba(0,0,0,.45)}
.wt span{font-size:12px;opacity:.95;font-weight:700}.wt b{font-size:19px;font-weight:800}
.wt.g{background:linear-gradient(135deg,#22c55e,#15803d)}
.wt.o{background:linear-gradient(135deg,#fb923c,#c2410c)}
.wt.y{background:linear-gradient(135deg,#fbbf24,#b45309)}
.wt.b{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.wt.r{background:linear-gradient(135deg,#f87171,#b91c1c)}
.wlist{display:flex;flex-direction:column;gap:8px}
.wj{width:100%;border:1px solid #e3eaf5;background:#fff;border-radius:16px;padding:12px;display:flex;justify-content:space-between;gap:10px;text-align:left;font-family:inherit;color:inherit}
.wjl{min-width:0;flex:1}.wjl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wjl small{color:#64748b;font-size:12px}
.wjr{text-align:right;flex:none}.wjr b{display:block;font-size:16px;font-weight:800}.wjr small{color:#64748b;font-size:11.5px}
.pos{color:#15803d}.neg{color:#c2410c}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
.tile2{background:#fff;border:1px solid #d9e1ef;border-radius:16px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit;color:#0A2A6A}
.tile2 .ti{font-size:26px}.tile2 b{font-size:15px}.tile2 small{color:#5f6d83;font-size:12px}
.tile2.soon{opacity:.6}
.gpop{position:fixed;inset:0;z-index:9998;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:12px}
.gpop-box{width:min(100%,560px);height:min(92vh,820px);background:#f2f5fb;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.gpop-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#0A2A6A;color:#fff;font-weight:800;font-size:17px}
.gpop-x{background:#fff;color:#0A2A6A;border:0;border-radius:10px;width:38px;height:38px;font-size:18px;font-weight:800;cursor:pointer}
.gpop iframe{flex:1;width:100%;border:0;background:#f2f5fb}

function walletOf(L){const d=doneOf(L);let earn=0,fee=0,cash=0,bal=0;d.forEach(b=>{const w=jobWallet(b);earn+=w.net;fee+=w.fee;if(w.cash)cash+=w.amt;bal+=w.eff});return{n:d.length,earn,fee,cash,bal}}
function avg(a){const v=a.filter(x=>x!=null);return v.length?Math.round(v.reduce((p,c)=>p+c,0)/v.length):null}
