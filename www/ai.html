<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4bc4">
<link rel="icon" href="icon-192.png">
<title>AR Smart Service – AI Assistant</title>
<style>
:root{--pri:#0f4bc4;--pri2:#0a2f7a;--bg:#f2f5fb;--tx:#18222f;--mu:#5f6d83;--bd:#d9e1ef;--bad:#d93025}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.w{max-width:620px;margin:0 auto}
.top{background:linear-gradient(135deg,#0a2f7a,#0f4bc4 58%,#1e88ff 130%);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 18px;border-radius:0 0 22px 22px}
.top h1{margin:0;font-size:19px}.top p{margin:2px 0 0;font-size:12.5px;opacity:.88}
#log{padding:12px 14px}
.m{max-width:88%;padding:10px 13px;border-radius:18px;margin:8px 0;white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.u{margin-left:auto;background:linear-gradient(135deg,#0f4bc4,#1e88ff);color:#fff;border-bottom-right-radius:6px}
.a h4{margin:10px 0 4px;font-size:15.5px;color:#0a2f7a}.a h4:first-child{margin-top:0}.a p{margin:6px 0}.a ul,.a ol{margin:6px 0;padding-left:20px}.a li{margin:3px 0}.a code{background:#eef3fb;border-radius:6px;padding:1px 5px;font-size:14px}.a.md{white-space:normal}
.a{background:#fff;border:1px solid #e3e9f4;border-bottom-left-radius:6px}
.sys{text-align:center;color:var(--mu);font-size:13.5px;margin:14px 8px}
.err{color:var(--bad)}
.sg{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px}.sg button{border:1.5px solid var(--bd);background:#fff;border-radius:20px;padding:7px 12px;font:inherit;font-size:13.5px;color:var(--pri2)}
.bar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--bd);padding:8px 10px;display:flex;gap:8px;max-width:620px;margin:0 auto}
.bar textarea{flex:1;font:inherit;border:1.5px solid var(--bd);border-radius:14px;padding:10px 12px;min-height:46px;max-height:110px;resize:none;outline:0}
.bar button{border:0;border-radius:14px;background:linear-gradient(135deg,#0f4bc4,#1e88ff);color:#fff;font:inherit;font-weight:700;padding:0 18px}.bar button:disabled{opacity:.55}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 16px rgba(15,50,120,.1);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav a{flex:1;text-align:center;text-decoration:none;color:var(--mu);font-size:11px;padding:8px 0 7px}.bnav a i{display:block;font-style:normal;font-size:21px}.bnav a.on{color:var(--pri);font-weight:700}
.bk39{background:rgba(255,255,255,.2);border:0;color:inherit;width:40px;height:40px;border-radius:13px;font-size:18px;flex:none;cursor:pointer}</style><script src="lang.js"></script><link rel="stylesheet" href="theme.css">
<script src="app-bridge.js"></script>
</head><body><div class="w">
<div class="top" style="display:flex;align-items:center;gap:12px"><button class="bk39" onclick="bk39()" aria-label="Back">←</button><div><h1>🤖 AI Assistant</h1><p>For technicians – questions on faults, error codes, gas/pressure, parts</p></div></div>
<div id="log"></div><div class="sg" id="sg"></div></div>
<div class="bar"><textarea id="q" rows="1" placeholder="Type your question… (e.g., LG AC showing CH05)"></textarea><button id="go">Send</button></div>
<nav id="nv"></nav>
<script src="fb.js"></script><script src="nav.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let H=[],USER=null,ROLE=null,BUSY=0,AIURL='/.netlify/functions/ai';
try{const c=localStorage.getItem('aiurl');if(c)AIURL=c}catch(e){}
FB.getConfig().then(c=>{if(c&&c.aiUrl){AIURL=c.aiUrl;try{localStorage.setItem('aiurl',c.aiUrl)}catch(e){}}}).catch(()=>{});
try{H=JSON.parse(sessionStorage.getItem('aichat')||'[]')}catch(e){}

const save=()=>{try{sessionStorage.setItem('aichat',JSON.stringify(H.slice(-30)))}catch(e){}};
function md(t){
 let x=String(t||'').replace(/\r/g,'');
 x=x.replace(/\s(\*\*(?:Step|स्टेप|चरण)[^*\n]{0,80}\*\*)/gi,'\n\n$1').replace(/([.!?।:])\s+\*\s+(?=\S)/g,'$1\n* ').replace(/\*\*\s+\*\s+(?=\S)/g,'**\n* ').replace(/\n\s*\*\s+/g,'\n* ');
 const L=x.split('\n');let o='',ul=0,ol=0;const cl=()=>{if(ul){o+='</ul>';ul=0}if(ol){o+='</ol>';ol=0}};
 const inl=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
 for(let ln of L){const t=ln.trim();let m;
  if(!t){cl();continue}
  if(m=t.match(/^#{1,4}\s+(.*)/)){cl();o+='<h4>'+inl(m[1])+'</h4>';continue}
  if(m=t.match(/^\*\*([^*]{2,90})\*\*:?$/)){cl();o+='<h4>'+inl(m[1])+'</h4>';continue}
  if(m=t.match(/^[*\-•]\s+(.*)/)){if(ol){o+='</ol>';ol=0}if(!ul){o+='<ul>';ul=1}o+='<li>'+inl(m[1])+'</li>';continue}
  if(m=t.match(/^\d+[.)]\s+(.*)/)){if(ul){o+='</ul>';ul=0}if(!ol){o+='<ol>';ol=1}o+='<li>'+inl(m[1])+'</li>';continue}
  cl();o+='<p>'+inl(t)+'</p>'}
 cl();return o}
function draw(){const l=$('#log');l.innerHTML=(H.length?'':'<div class="sys">Hello! Type your question. If you tell us the brand, model and symptoms (or error code), the answer will be accurate.</div>')+H.map(m=>`<div class="m ${m.role=='user'?'u':'a'} ${m.err?'err':''} ${m.role!='user'&&!m.err?'md':''}">${m.role!='user'&&!m.err?md(m.content):esc(m.content)}</div>`).join('')+(BUSY?'<div class="m a">⏳ Thinking…</div>':'');scrollTo(0,document.body.scrollHeight)}
$('#sg').innerHTML=['CH05 error in LG AC','Inverter AC cooling less','Washing machine not draining','What should the R32 gas pressure be'].map(t=>`<button>${esc(t)}</button>`).join('');
document.querySelectorAll('#sg button').forEach(b=>b.onclick=()=>{$('#q').value=b.textContent;send()});
async function send(){
 const t=$('#q').value.trim();if(!t||BUSY)return;
 if(!USER){H.push({role:'assistant',content:'Log in first (from tech.html).',err:1});draw();return}
 $('#q').value='';H.push({role:'user',content:t});BUSY=1;$('#go').disabled=true;draw();
 try{const tok=await FB.idToken();
  const msgs=H.filter(m=>!m.err).map(m=>({role:m.role,content:String(m.content).slice(0,1800)}));
  if(msgs.length&&msgs[msgs.length-1].role=='user')msgs[msgs.length-1].content+='\n\n(Answer in simple English, in short step-by-step points.)';
  let r,d={};
  for(let k=0;k<3;k++){
   r=await fetch(AIURL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({idToken:tok,messages:msgs})});
   d={};try{d=await r.json()}catch(e){}
   const busy=!r.ok&&[429,500,502,503,504].includes(r.status)&&!/key/i.test(d.msg||d.error||'');
   const busy2=r.ok&&!d.reply&&/demand|overload|try again/i.test(JSON.stringify(d));
   if((busy||busy2)&&k<2){await new Promise(z=>setTimeout(z,2500*(k+1)));continue}
   break}
  if(r.ok&&d.reply)H.push({role:'assistant',content:d.reply});
  else{const m=r.status==404?'The AI server is not connected yet. Tell the owner: the AI server link has to be added in Admin → Error code page.':r.status==503?'The AI key is not set yet – inform the owner.':r.status==403?(d.msg||'This feature is only for technicians'):('AI is busy right now, please try again in a while.'+(d.msg&&!/demand/i.test(d.msg)?' ('+d.msg+')':''));H.push({role:'assistant',content:m,err:1})}}
 catch(e){H.push({role:'assistant',content:'Internet/server problem – please try again.',err:1})}
 BUSY=0;$('#go').disabled=false;save();draw()}
$('#go').onclick=send;$('#q').addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();send()}});
FB.onAuth(async u=>{USER=u;if(!u){location.replace('login.html');return}try{ROLE=await FB.role(u)}catch(e){}if(ROLE=='customer'){location.replace('booking.html#my=1');return}ARNAV.set(ROLE);ARNAV.render($('#nv'),'ai',ROLE);draw()});
draw();
</script><script>function bk39(){if(history.length>1)history.back();else location.href="index.html"}</script></body></html>
